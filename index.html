<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yulduzli Particle Morphing - Mobil uchun To'liq Fix</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none; /* Mobil qurilmalarda ekranni tortganda siljib ketmasligi uchun */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Input interfeysi har doim o'rtada va to'g'ri joylashishi uchun */
        #input-container {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 85%;
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 200, 0.4);
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.15);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 200, 0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="webgl"></canvas>
    <div id="input-container">
        <input type="text" id="star-input" placeholder="Ismingizni yozing..." maxlength="15">
    </div>

    <script>
        // 1. Scene, Camera, Renderer sozlash
        const canvas = document.querySelector('#webgl');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 60; 

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 2. Yulduzlar (Zarrachalar) tizimi
        const particleCount = 12000; // Mobil telefonlar qotmasligi uchun optimal miqdor
        const geometry = new THREE.BufferGeometry();
        
        const positions = new Float32Array(particleCount * 3); 
        const randomPositions = new Float32Array(particleCount * 3); 
        const targetPositions = new Float32Array(particleCount * 3); 

        // Tasodifiy sochish koordinatalari
        for (let i = 0; i < particleCount * 3; i += 3) {
            randomPositions[i] = (Math.random() - 0.5) * 140;     
            randomPositions[i + 1] = (Math.random() - 0.5) * 90;  
            randomPositions[i + 2] = (Math.random() - 0.5) * 60;  

            positions[i] = randomPositions[i];
            positions[i + 1] = randomPositions[i + 1];
            positions[i + 2] = randomPositions[i + 2];

            targetPositions[i] = randomPositions[i];
            targetPositions[i + 1] = randomPositions[i + 1];
            targetPositions[i + 2] = randomPositions[i + 2];
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Yulduz teksturasi
        const pCanvas = document.createElement('canvas');
        pCanvas.width = 16; pCanvas.height = 16;
        const pCtx = pCanvas.getContext('2d');
        const gradient = pCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        pCtx.fillStyle = gradient; pCtx.fillRect(0, 0, 16, 16);
        const pTexture = new THREE.CanvasTexture(pCanvas);

        const material = new THREE.PointsMaterial({
            size: 0.45,
            map: pTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            color: 0x00ffff
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // 3. MATNNI PIKSELLARGA DINAMIK O'GIRISH (MOBIL MOSLASHUVCHAN)
        const textCanvas = document.createElement('canvas');
        const textCtx = textCanvas.getContext('2d');
        
        function textToParticles(text) {
            if (text === '') {
                for (let i = 0; i < particleCount * 3; i++) {
                    targetPositions[i] = randomPositions[i];
                }
                material.color.setHex(0x00ffff);
                return;
            }

            material.color.setHex(0xff3333); // Yozuv rangini pushtiga o'zgartirish

            // Kenglik va balandlikni kattaroq olamiz, skale yordamida o'lchamni boshqaramiz
            const width = 300;
            const height = 80;
            textCanvas.width = width;
            textCanvas.height = height;

            textCtx.clearRect(0, 0, width, height);
            
            // Matn uzunligiga qarab shrift o'lchamini dinamik kichraytirish (Chekkadan chiqib ketmasligi uchun)
            let fontSize = 32;
            if (text.length > 6) fontSize = 24;
            if (text.length > 10) fontSize = 18;

            textCtx.font = `bold ${fontSize}px sans-serif`;
            textCtx.fillStyle = 'white';
            textCtx.textAlign = 'center';
            textCtx.textBaseline = 'middle';
            textCtx.fillText(text.toUpperCase(), width / 2, height / 2);

            const imageData = textCtx.getImageData(0, 0, width, height).data;
            const points = [];

            // Ekran torligiga (mobilga) qarab zarrachalarning umumiy masshtabini o'zgartiramiz
            const isMobile = window.innerWidth <= 480;
            const scale = isMobile ? 0.28 : 0.45; 

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const alpha = imageData[((y * width) + x) * 4 + 3];
                    if (alpha > 128) {
                        points.push({
                            x: (x - width / 2) * scale, 
                            y: -(y - height / 2) * scale
                        });
                    }
                }
            }

            // Nuqtalarni zarrachalarga taqsimlash
            let pIndex = 0;
            for (let i = 0; i < particleCount * 3; i += 3) {
                if (points.length > 0) {
                    const pt = points[pIndex % points.length];
                    targetPositions[i] = pt.x + (Math.random() - 0.5) * 0.3; 
                    targetPositions[i + 1] = pt.y + (Math.random() - 0.5) * 0.3;
                    targetPositions[i + 2] = (Math.random() - 0.5) * 2;   
                    pIndex++;
                } else {
                    targetPositions[i] = randomPositions[i];
                    targetPositions[i + 1] = randomPositions[i + 1];
                    targetPositions[i + 2] = randomPositions[i + 2];
                }
            }
        }

        // Input element va uning hodisasi
        const inputElement = document.getElementById('star-input');
        inputElement.addEventListener('input', (e) => {
            textToParticles(e.target.value);
        });

        // 4. SICHQONCHA VA SENSOR HARAKATLARI
        const mouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Mobil sensor teginishini boshqarish
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }, { passive: false });

        // 5. RESIZE MOSLASHUVCHANLIGI
        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);

            // Ekran kichrayganda kamerani orqaga surib, zarrachalar o'lchamini kattalashtiramiz
            if (width <= 480) {
                camera.position.z = 75;      
                material.size = 0.6;        
            } else {
                camera.position.z = 60;      
                material.size = 0.45;
            }
            material.needsUpdate = true;
            
            // Ekran o'zgarganda matnni qayta hisoblab render qilish
            textToParticles(inputElement.value);
        }

        window.addEventListener('resize', handleResize);
        handleResize();

        // 6. ANIMATSIYA TSIKLI
        const animate = () => {
            requestAnimationFrame(animate);

            const positionAttribute = geometry.attributes.position;

            // Lerp orqali silliq harakatlanish
            for (let i = 0; i < particleCount * 3; i++) {
                positionAttribute.array[i] += (targetPositions[i] - positionAttribute.array[i]) * 0.08;
            }
            positionAttribute.needsUpdate = true;

            // Burilish effekti
            if(inputElement.value === '') {
                particleSystem.rotation.y += 0.001;
                particleSystem.rotation.x += 0.0005;
            } else {
                particleSystem.rotation.y += (mouse.x * 0.3 - particleSystem.rotation.y) * 0.05;
                particleSystem.rotation.x += (-mouse.y * 0.3 - particleSystem.rotation.x) * 0.05;
            }

            renderer.render(scene, camera);
        };

        animate();
    </script>
</body>
</html>
